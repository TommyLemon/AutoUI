name: Android CI

on:
  push:
    branches: [ "main" ]
    # paths:
    #   - 'AutoUI-Android/**'
  pull_request:
    branches: [ "main" ]
    # paths:
    #   - 'AutoUI-Android/**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
    - name: Build gradlew
      working-directory: AutoUI-Android
      run: gradle wrapper
    - name: Grant execute permission for gradlew
      working-directory: AutoUI-Android
      run: chmod +x gradlew
    - name: Build with Gradle
      working-directory: AutoUI-Android
      run: ./gradlew build
